name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint--.

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      # Setup Convex Environment for Testing (Mock or Dev)
      # Since we are running unit/integration tests that mock DB, we might not need full Convex dev.
      # However, requirement says "Ensure the Convex environment is set up for CI testing."
      # If tests required real Convex, we would do:
      # - run: npx convex dev --once
      # But our tests mock the DB calls in unit tests and bypass them in integration tests.
      # So we strictly don't need a running Convex backend for *these* specific tests as written.
      # But to be safe and future-proof:
      # We just set the env var to a dummy value if needed by some imports.
      
      - name: Run Tests
        run: npm run test
        env:
          # Pass GitHub Secrets to Environment Variables
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # Ensure Next.js/Convex client doesn't crash on missing env var
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_URL || 'https://mock-convex-url.convex.cloud' }}